name: Daily Build & Deploy to Namecheap

on:
  push:
    branches: [main]       # Auto-deploy on every push to main (~3 min, no waiting for cron)
  schedule:
    - cron: "0 5 * * *"   # Daily safety run at 05:00 UTC = 09:00 UAE time
  workflow_dispatch:       # Allows manual trigger from GitHub UI

# Only one deploy at a time; a new push cancels older in-progress runs so the
# latest commit deploys once instead of several runs piling up.
concurrency:
  group: deploy-namecheap
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      # rsync over SSH, not FTP. The FTP link to this host runs at ~26 KB/s, and the
      # built site is ~175 MB, so a full transfer could not finish inside the job —
      # every run since 27 July failed partway and left the deploy half-applied.
      # Over SSH the same sync takes seconds because rsync sends only changed blocks.
      #
      # --delete prunes stale files (old _next chunks accumulate on every build), but
      # the excludes below are load-bearing: they are server-only paths that are NOT in
      # the build output, and deleting them would break the site.
      #   backend/      — the PHP endpoint .htaccess routes /api/contact to
      #   .well-known/  — ACME / certificate validation
      - name: Deploy to Namecheap via rsync over SSH
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: "21098"
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          rsync -az --delete --delete-after --stats \
            --exclude '/backend/' \
            --exclude '/.well-known/' \
            --exclude '/.ftp-deploy-sync-state.json' \
            --exclude '/sitemap-news.xml' \
            -e "ssh -i ~/.ssh/deploy_key -p $SSH_PORT -o StrictHostKeyChecking=yes" \
            ./out/ "$SSH_USER@$SSH_HOST:/home/$SSH_USER/anastanveer.com/"

          rm -f ~/.ssh/deploy_key

      # A deploy that silently uploads nothing is worse than one that fails loudly,
      # so confirm a known page is actually being served before calling it done.
      - name: Verify the site responds
        run: |
          set -euo pipefail
          for path in "" "blog/" "contact/"; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "https://anastanveer.com/$path")
            echo "  /$path -> $code"
            [ "$code" = "200" ] || { echo "::error::https://anastanveer.com/$path returned $code"; exit 1; }
          done

      # After the new files are live, ping IndexNow so Bing/Yandex/Seznam/Naver
      # re-crawl quickly. Reads URLs from out/sitemap.xml; keyless (no secrets).
      - name: Submit URLs to IndexNow
        run: node scripts/indexnow-submit.mjs
        continue-on-error: true
