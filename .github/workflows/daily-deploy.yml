name: Daily Build & Deploy to Namecheap

on:
  push:
    branches: [main]       # Auto-deploy on every push to main (~3 min, no waiting for cron)
  schedule:
    - cron: "0 5 * * *"   # Daily safety run at 05:00 UTC = 09:00 UAE time
  workflow_dispatch:       # Allows manual trigger from GitHub UI

# Only one deploy at a time; a new push cancels older in-progress runs so the
# latest commit deploys once instead of several runs piling up.
concurrency:
  group: deploy-namecheap
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Deploy to Namecheap via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./out/
          server-dir: /anastanveer.com/
          timeout: 120000
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**

      # After the new files are live, ping IndexNow so Bing/Yandex/Seznam/Naver
      # re-crawl quickly. Reads URLs from out/sitemap.xml; keyless (no secrets).
      - name: Submit URLs to IndexNow
        run: node scripts/indexnow-submit.mjs
        continue-on-error: true
