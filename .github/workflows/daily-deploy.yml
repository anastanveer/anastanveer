name: Daily Build & Deploy to Namecheap

on:
  schedule:
    - cron: "0 5 * * *"   # Runs at 05:00 UTC = 09:00 UAE time (UTC+4) — best time for Google indexing
  workflow_dispatch:       # Allows manual trigger from GitHub UI

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Deploy to Namecheap via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./out/
          server-dir: /anastanveer.com/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
