name: Daily Build & Deploy to Namecheap

on:
  push:
    branches: [main]       # Auto-deploy on every push to main (~3 min, no waiting for cron)
  schedule:
    - cron: "0 5 * * *"   # Daily safety run at 05:00 UTC = 09:00 UAE time
  workflow_dispatch:       # Allows manual trigger from GitHub UI

# Only one deploy at a time; a new push cancels older in-progress runs so the
# latest commit deploys once instead of several runs piling up.
concurrency:
  group: deploy-namecheap
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      # rsync over SSH, not FTP. The FTP link to this host runs at ~26 KB/s, and the
      # built site is ~175 MB, so a full transfer could not finish inside the job —
      # every run since 27 July failed partway and left the deploy half-applied.
      # Over SSH the same sync takes seconds because rsync sends only changed blocks.
      #
      # --delete prunes stale files (old _next chunks accumulate on every build), but
      # the excludes below are load-bearing: they are server-only paths that are NOT in
      # the build output, and deleting them would break the site.
      #   backend/      — the PHP endpoint .htaccess routes /api/contact to
      #   .well-known/  — ACME / certificate validation
      - name: Deploy to Namecheap via rsync over SSH
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: "21098"
        run: |
          set -uo pipefail

          # Fail with a readable reason rather than a bare non-zero exit. A missing
          # secret and a blocked port look identical in the log otherwise.
          for v in SSH_KEY SSH_HOST SSH_USER; do
            if [ -z "${!v:-}" ]; then
              echo "::error::Secret $v is empty or not set on this repository."
              exit 1
            fi
          done
          echo "secrets present · host=${SSH_HOST} user=${SSH_USER} port=${SSH_PORT}"

          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # Accept the key either as PEM text or as a single base64 line. Pasting a
          # multi-line PEM into a secret field is easy to get subtly wrong — a stray
          # CR or a lost final newline is invisible and breaks parsing — so base64
          # is offered as the shape that cannot be mangled.
          if printf '%s' "$SSH_KEY" | grep -q 'BEGIN .*PRIVATE KEY'; then
            printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          else
            printf '%s' "$SSH_KEY" | tr -d '[:space:]' | base64 -d > ~/.ssh/deploy_key 2>/dev/null
          fi
          # Guarantee exactly one trailing newline, which OpenSSH requires.
          printf '%s\n' "$(cat ~/.ssh/deploy_key)" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          if ! ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null 2>&1; then
            echo "what arrived: $(wc -l < ~/.ssh/deploy_key) lines, first=[$(head -1 ~/.ssh/deploy_key | cut -c1-40)] last=[$(tail -1 ~/.ssh/deploy_key | cut -c1-40)]"
            echo "::error::SSH_PRIVATE_KEY did not parse. Paste either the full PEM (BEGIN through END) or the single-line base64 form."
            exit 1
          fi
          echo "private key parses OK"

          # Can this runner even reach the SSH port? Shared hosts sometimes firewall
          # cloud ranges, which is worth distinguishing from an auth failure.
          if ! timeout 20 bash -c "cat < /dev/null > /dev/tcp/${SSH_HOST}/${SSH_PORT}" 2>/dev/null; then
            echo "::error::Cannot reach ${SSH_HOST}:${SSH_PORT} from this runner — the host is likely blocking GitHub's IP range."
            exit 1
          fi
          echo "port reachable"

          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          if ! ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o StrictHostKeyChecking=no \
                   -o BatchMode=yes -o ConnectTimeout=20 "$SSH_USER@$SSH_HOST" true; then
            echo "::error::SSH auth failed — the public half of this key is not in ~/.ssh/authorized_keys on the server, or SSH_USER is wrong."
            exit 1
          fi
          echo "ssh auth OK"

          echo "runner rsync: $(rsync --version | head -1)"
          echo "server rsync: $(ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" 'rsync --version 2>&1 | head -1' || echo UNAVAILABLE)"

          set +e
          rsync -az --delete --delete-after --stats \
            --exclude '/backend/' \
            --exclude '/.well-known/' \
            --exclude '/.ftp-deploy-sync-state.json' \
            --exclude '/sitemap-news.xml' \
            -e "ssh -i ~/.ssh/deploy_key -p $SSH_PORT -o StrictHostKeyChecking=no" \
            ./out/ "$SSH_USER@$SSH_HOST:/home/$SSH_USER/anastanveer.com/" 2>rsync.err
          rc=$?
          set -e
          if [ $rc -ne 0 ]; then
            echo "::error::rsync exited $rc — $(tr '\n' ' ' < rsync.err | cut -c1-400)"
            cat rsync.err
            exit $rc
          fi

          rm -f ~/.ssh/deploy_key

      # A deploy that silently uploads nothing is worse than one that fails loudly,
      # so confirm a known page is actually being served before calling it done.
      - name: Verify the site responds
        run: |
          set -euo pipefail
          for path in "" "blog/" "contact/"; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "https://anastanveer.com/$path")
            echo "  /$path -> $code"
            [ "$code" = "200" ] || { echo "::error::https://anastanveer.com/$path returned $code"; exit 1; }
          done

      # After the new files are live, ping IndexNow so Bing/Yandex/Seznam/Naver
      # re-crawl quickly. Reads URLs from out/sitemap.xml; keyless (no secrets).
      - name: Submit URLs to IndexNow
        run: node scripts/indexnow-submit.mjs
        continue-on-error: true
